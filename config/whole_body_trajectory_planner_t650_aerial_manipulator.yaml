# whole_body_trajectory_planner -- AM-T650 (T650 airframe + OM-X arm).
#
# Loaded by launch/whole_body_trajectory_planner_launch.py by default. The
# flight stack's own yamls carry an identical section so one file can
# describe a whole run; keep the two in step.
/**/whole_body_trajectory_planner:
  ros__parameters:
    # Airframe + arm model, from the registry (src/vehicle_model.cpp).
    vehicle: "t650_aerial_manipulator"
    # Transition backend, from the registry (src/trajectory.cpp). One entry
    # since 2026-09-17:
    #   bspline        flat B-spline outputs, constraints ENFORCED (rest,
    #                  joint box, speed/accel, rotor + joint-torque bounds)
    # (the straight_line Picard backend was removed that day; the registry is
    # still the extension point for a new one.)
    planner: "bspline"
    stream_rate: 100.0          # WholeBodyReference + arm reference [Hz]

    # --- kinematic bounds ------------------------------------------------
    v_max: 0.30                 # peak CoM speed               [m/s]
    a_max: 0.15                 # peak CoM acceleration        [m/s^2]
    w_max: 0.30                 # peak rate, any angle channel [rad/s]
    t_min: 3.0                  # never faster than this       [s]

    # --- bspline only ----------------------------------------------------
    dw_max: 0.60                # peak angular acceleration    [rad/s^2]
    t_max: 40.0                 # refuse rather than crawl     [s]
    tau_joint_max: 3.0          # MUST equal the law's wb_tau_max; <= 0 disables
    rotor_bounds: true          # rotor speed bounds via inverse dynamics
    n_check: 101                # diagnostic grid; 0 disables

    # The folded HOME pose (Go Home) [rad] = the arm controller's home_position.
    home_pose: [0.0, 0.698132, 0.698132, 0.0]
    # Bare-airframe CoM, MODEL frame [m]. MUST equal the node's wb_base_com_*.
    base_com: [0.0, 0.0, 0.0]
    # World-EE-anchored hold. Keep false (see the node header).
    hold_ee_world: false
    # ARM <-> MODEL joint sign map. Identity in Isaac; [-1, 1, 1, -1] on the
    # URDF/Dynamixel hardware arm.
    arm_joint_sign: [1.0, 1.0, 1.0, 1.0]

    # --- end-effector trajectory mode (arm GS "EE trajectory" tab) ------
    ee_traj_circle_radius: 1.0      # [m]
    ee_traj_fig8_a: 1.0             # figure-8 half-length along the heading [m]
    ee_traj_fig8_b: 0.5            # half-width across it [m]
    ee_traj_lap_time: 24.0          # one lap at time scale 1 [s]
    ee_traj_laps: 2
    ee_traj_ccw: true               # circle turns counter-clockwise
    ee_traj_center_origin: true     # circle centred on the world origin at the EE height
    ee_traj_ramp_time: 4.0          # min-snap ramp-in / ramp-out [s]
    # EE attitude about its heading = the fold q2+q3 at rest. 80 deg is the
    # flown home fold; 0 (a level EE) is this arm's wrist singularity -> refused.
    ee_traj_fold_deg: 80.0
    ee_traj_q2_center_deg: 40.0     # the assigned redundancy DoF: q2 sinusoid
    ee_traj_q2_amp_deg: 8.0
    ee_traj_q2_period_s: 0.0        # 0 -> one lap
    ee_traj_qdot_max: 0.5           # [rad/s]
    ee_traj_time_scale: 1.0         # the default request; the GS slider overrides
    ee_traj_start_pos_tol: 0.05     # Start button gate: [m], [deg], [deg]
    ee_traj_start_yaw_tol_deg: 5.0
    ee_traj_start_joint_tol_deg: 3.0

    # --- pick-and-place mode (arm GS "Pick & Place" tab) ----------------
    # Six legs, one button each: go_to_start -> execute_pick ->
    # go_to_place_start -> execute_place -> go_to_land_start -> execute_land.
    # Base poses [x, y, z, yaw_deg], world frame, ACTUAL yaw, and the place
    # point: TYPED IN (the arm GS's Pick & Place tab writes them live; an edit
    # makes the plan stale). All are shifted by the Adjust offset (vehicle on
    # the start mark -> measured - nominal start). Only the PICK point is
    # measured (mocap obj_0, the Get button).
    pick_place_start: [0.0, 0.0, 1.0, 0.0]
    pick_place_place_start: [0.0, -1.0, 1.0, 0.0]
    pick_place_land_start: [-1.0, 0.0, 1.0, 0.0]
    # The hover over the landing spot; touchdown is SAFETY -> land. NOT lower:
    # the body stands at 0.305 m on its gear, and in the 2026-10-01 Isaac
    # flight a 0.4 m hover dipped to 0.318 m in the DIRECT law's +-0.1 m
    # oscillation, brushed the floor, saturated the allocator and tumbled on
    # the switch to SAFETY.
    pick_place_land: [-1.0, 0.0, 0.8, 0.0]
    pick_place_place_point: [0.6, -1.6, 0.66]    # the claw's release point [x, y, z]
    # Arm poses [deg]. [0, 0, 0, 0] = upper arm straight down, forearm out
    # along the nose, claw straight down (grasp point 0.155 m ahead of and
    # 0.340 m below the body origin). It is the bottom of the arm's reach:
    # from there the arm alone can raise the claw, pull it in or swing it
    # sideways, but not lower it.
    pick_place_pick_pose_deg: [0.0, 0.0, 0.0, 0.0]
    pick_place_place_pose_deg: [0.0, 0.0, 0.0, 0.0]
    pick_place_carry_pose_deg: [0.0, 40.0, 40.0, 0.0]
    # claw target = measured mocap point + this offset, world [m]
    pick_place_pick_ee_offset: [0.0, 0.0, 0.0]
    pick_place_place_ee_offset: [0.0, 0.0, 0.0]
    pick_place_face_target: true       # turn the nose to the object over the leg
    pick_place_retreat_dz: 0.15        # before leaving a table: climb [m] ...
    pick_place_retreat_back: 0.20      # ... then back off along -nose [m]
    # (a leg retreats whenever it starts from a table: after execute_pick /
    # execute_place, whichever leg is flown next)
    # execute_pick / execute_place fly to the point approach_dz ABOVE the
    # target first, hold there until the claw has been inside arrival_tol for
    # settle_s, then descend vertically onto it. 0 = straight onto the target.
    pick_place_approach_dz: 0.10       # [m]
    pick_place_approach_wait_max: 60.0 # no descent after this long: leg ends incomplete [s]
    # execute_place: the arm sweeps these bands [deg] on the way (lo == hi:
    # not swept), `cycles` whole sweeps, at most sweep_qdot_max. +-10 deg
    # (2026-10-02): +-25 deg tripped the 20 deg tilt watchdog in Isaac.
    pick_place_sweep_lo_deg: [-10.0, 17.5, 0.0, 0.0]
    pick_place_sweep_hi_deg: [10.0, 37.5, 0.0, 0.0]
    pick_place_sweep_phase_deg: [0.0, 90.0, 0.0, 0.0]
    pick_place_sweep_cycles: 2
    pick_place_sweep_ramp_frac: 0.2
    pick_place_sweep_qdot_max: 0.5     # [rad/s]
    pick_place_sweep_t_min: 8.0        # [s]
    pick_place_sweep_t_max: 120.0      # [s]
    pick_place_arrival_tol: 0.05       # claw error gate: descent + fine correction [m]
    pick_place_settle_s: 1.0           # ... held inside it this long first [s]
    pick_place_leg_start_tol: 0.15     # a leg starts only with the body this close to its hold [m]
    pick_place_abort_climb: 0.30       # ABORT: arm home, the vehicle this much higher [m]
                                       # (clipped at fence_max_z)
    pick_place_adjust_max: 0.5         # Adjust refuses a larger offset [m]
    # Geofence on the BODY ORIGIN along every leg (goals, approach points and
    # each planned path; world frame [m]). 0.6 m floor: the body stands at
    # 0.305 m on its gear and the law swings +-0.1 m.
    pick_place_fence_min_z: 0.6
    pick_place_fence_max_z: 1.8
    pick_place_fence_xy: [-2.5, 2.5, -2.5, 2.5]   # [x_min, x_max, y_min, y_max]
    pick_place_adjust_z: false         # Adjust shifts x, y only unless these are set
    pick_place_adjust_yaw: false
    # mocap bodies (fsc_autopilot_ros2_msgs/Mocap, ABSOLUTE topics); "" = none.
    # Fixed at launch. A place topic + capture_place overrides the typed point.
    pick_place_pick_topic: "/obj_0/mocap"
    pick_place_place_topic: ""
    pick_place_start_topic: ""
    pick_place_place_start_topic: ""
    pick_place_land_start_topic: ""
    pick_place_land_topic: ""
    pick_place_capture_window: 0.5     # a capture averages this many seconds [s]
    pick_place_capture_max_spread: 0.02  # ... and is refused above this scatter [m]

    # Topic layout (relative to the vehicle namespace).
    topic_prefix: "whole_body_planner"
    mode_topic: "fsc_autopilot_ros2/whole_body_direct_actuation/mode"
    reference_topic: "fsc_autopilot_ros2/whole_body_direct_actuation/reference"
    gs_reference_topic: "fsc_autopilot_ros2/position_controller/reference"
    odom_topic: "state_estimator/local_position/odom"
    attitude_topic: "fmu/out/vehicle_attitude"
    joint_states_topic: "fsc_open_manipulator/joint_states"
    arm_reference_topic: "fsc_open_manipulator/external_torque_controller/reference_joint_trajectory"
